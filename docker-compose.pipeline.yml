# Pipeline-Mode Compose: worker dials outbound to sentinelCam-web.
# No inbound ports are required.
#
# Quick start:
#   cp .env.pipeline.example .env
#   # edit .env, set WEB_URL + WEB_TOKEN
#   docker compose -f docker-compose.pipeline.yml up -d --build
#
# For CPU-only hosts override the build arg and remove the gpus reservation:
#   docker compose -f docker-compose.pipeline.yml -f docker-compose.pipeline.cpu.yml up -d --build

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sentinelcam-worker-pipeline:latest
    container_name: sentinelcam-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    # Direct connection (no Cloudflare).
    # Preferred: set WEB_URL=https://ie-lis050 in .env — the web server's
    # internal hostname (listed in Traefik's router rule). The worker resolves
    # it via your network DNS, so nothing is needed here.
    # Fallback — only if THIS container cannot resolve that name via DNS: keep
    # WEB_URL=https://sentinelcam.ch, set WEB_HOSTNAME + WEB_DIRECT_IP in .env,
    # and uncomment the two lines below to pin the IP:
    # extra_hosts:
    #   - "${WEB_HOSTNAME:-sentinelcam.ch}:${WEB_DIRECT_IP:?set WEB_DIRECT_IP in .env}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Writable cache for ultralytics auto-downloaded weights + matplotlib cache.
      # WORKER_YOLO_CACHE_DIR (defaults to ~/.cache/yolo-models) is chdir'd into
      # before YOLO instantiation so downloads land here and survive restarts.
      - yolo-cache:/home/sentinelcam/.cache
      - yolo-config:/home/sentinelcam/.config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "web_pipeline.run"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  yolo-cache:
  yolo-config:
