# Pipeline-Mode Compose: worker dials outbound to sentinelCam-web.
# No inbound ports are required.
#
# Quick start:
#   cp .env.pipeline.example .env
#   # edit .env, set WEB_URL + WEB_TOKEN
#   docker compose -f docker-compose.pipeline.yml up -d --build
#
# For CPU-only hosts override the build arg and remove the gpus reservation:
#   docker compose -f docker-compose.pipeline.yml -f docker-compose.pipeline.cpu.yml up -d --build

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sentinelcam-worker-pipeline:latest
    container_name: sentinelcam-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    # VPN/LAN-direct: resolve the public hostname to the web server's directly
    # reachable IP so the worker dials the origin (over VPN/LAN) and bypasses
    # Cloudflare's unreliable WebSocket proxying (which causes periodic
    # "keepalive ping timeout" drops). Values come from .env (WEB_HOSTNAME,
    # WEB_DIRECT_IP). Remove this block if you intentionally route via Cloudflare.
    extra_hosts:
      - "${WEB_HOSTNAME:-sentinelcam.ch}:${WEB_DIRECT_IP:?set WEB_DIRECT_IP in .env (web server IP), or remove the extra_hosts block to use Cloudflare}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Writable cache for ultralytics auto-downloaded weights + matplotlib cache.
      # WORKER_YOLO_CACHE_DIR (defaults to ~/.cache/yolo-models) is chdir'd into
      # before YOLO instantiation so downloads land here and survive restarts.
      - yolo-cache:/home/sentinelcam/.cache
      - yolo-config:/home/sentinelcam/.config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "web_pipeline.run"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  yolo-cache:
  yolo-config:
