# Shared launcher settings for run.sh and run.bat
# Simple KEY=VALUE format so both scripts can read the same file.

RUNTIME_DIR=.runtime
VENV_SUBDIR=venv
ULTRA_CFG_SUBDIR=ultralytics_config
WEIGHTS_SUBDIR=weights
RUNS_SUBDIR=runs
DATASETS_SUBDIR=datasets
PIP_CACHE_SUBDIR=pip-cache

# Default sources can differ per OS, but they live in this one shared file, like that rtsp://11.111.1.111:8554
DEFAULT_SOURCE_LINUX=0
DEFAULT_SOURCE_WINDOWS=0

# Shared webcam.py defaults
# auto = CUDA if available, otherwise Apple Metal/MPS, otherwise CPU
DEFAULT_DEVICE=auto
DEFAULT_PERFORMANCE_PROFILE=auto
# 0 = auto = all logical cores
DEFAULT_CPU_THREADS=0
# simple avoids Ultralytics tracker overhead for live streaming.
DEFAULT_TRACKER_MODE=simple
# Use FP16 inference on CUDA devices.
DEFAULT_YOLO_HALF=1
# 0 = auto; local webcam sources follow WebRTC fps by default
DEFAULT_CAMERA_FPS=0
DEFAULT_USE_POSE=0
DEFAULT_ADAPTIVE_POSE=1
DEFAULT_POSE_MIN_YOLO_FPS=12.0
DEFAULT_MAX_FPS=120
DEFAULT_WEB_HOST=127.0.0.1

# Shared vcam defaults (used by run.sh)
VCAM_DEFAULT_INPUT=testsrc
VCAM_DEFAULT_NR=42
VCAM_DEFAULT_SIZE=1920x1080
VCAM_DEFAULT_FPS=60

# Hardware-aware model/preset defaults (reserved for launcher overrides)
DEFAULT_PRESET_CPU=yolov8n
DEFAULT_PRESET_ACCEL=yolov8m

# Default web streaming settings
# Bind host for the worker web stream. Use 0.0.0.0 to expose it on the LAN.
# Optional bearer token for stream + API protection.
#WEB_AUTH_TOKEN=replace-with-a-long-random-secret
# Optional comma-separated CORS allowlist for trusted browser origins.
# Example: WEB_ALLOWED_ORIGINS=http://127.0.0.1:3000,http://localhost:3000
#WEB_ALLOWED_ORIGINS=
# Max accepted size of POST /api/cmd in bytes.
#WEB_MAX_CMD_BYTES=8192
# Preferred worker stream mode: auto|webrtc|mjpeg
DEFAULT_STREAM_MODE=auto
# Preferred WebRTC codec: auto|h264|vp8|vp9|av1. Auto uses hardware H.264 when available, VP8 on CPU fallback.
DEFAULT_WEBRTC_CODEC=auto
# Target WebRTC video bitrate in kbps (-1 = hardware-aware auto, 0 = aiortc default bitrate control)
DEFAULT_WEBRTC_BITRATE_KBPS=-1
# Target WebRTC video fps (0 = hardware-aware auto, e.g. 60 on stronger devices)
DEFAULT_WEBRTC_FPS=0
# WebRTC ICE UDP port range (restrict media transport to these ports)
DEFAULT_WEBRTC_PORT_MIN=50000
DEFAULT_WEBRTC_PORT_MAX=51000
# Use GPU H.264 encoder if available (1=auto-detect, 0=force CPU)
DEFAULT_WEBRTC_GPU=1
# Frame sharing: encode once, share to all clients (1=on, 0=off)
DEFAULT_WEBRTC_FRAME_SHARING=1
# Stream quality preset: low|medium|high|ultra|auto
DEFAULT_STREAM_QUALITY=auto
# JPEG quality for MJPEG fallback (10-95)
DEFAULT_JPEG_QUALITY=88

# Optional Ollama context detection ("what is currently happening")
# Enable with --context, context_on API command, or DEFAULT_CONTEXT_ENABLED=1.
DEFAULT_CONTEXT_ENABLED=0
# Context is opt-in. When enabled, the launcher can install Ollama natively
# and pull the selected model for the current platform/profile.
DEFAULT_CONTEXT_SETUP_OLLAMA=1
DEFAULT_CONTEXT_PROFILE=auto
DEFAULT_CONTEXT_MODEL=auto
# interval|person_appears|person_present|manual
DEFAULT_CONTEXT_TRIGGER=person_appears
DEFAULT_CONTEXT_INTERVAL=30.0
DEFAULT_CONTEXT_COOLDOWN=60.0
DEFAULT_CONTEXT_TIMEOUT=45.0
DEFAULT_CONTEXT_IMAGE_WIDTH=512
DEFAULT_CONTEXT_MIN_YOLO_FPS=15.0
DEFAULT_CONTEXT_OVERLAY=1
#DEFAULT_CONTEXT_PROMPT=
